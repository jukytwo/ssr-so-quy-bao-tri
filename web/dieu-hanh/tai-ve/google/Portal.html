<!DOCTYPE html>
<html lang="vi">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1F5F1;--sf:#fff;--ln:#DAE3DB;--ink:#14231B;--ink2:#3F5347;--ink3:#6A7C71;--em:#0B6E47;--em9:#063B28;--gold:#C9A24A;--g1:#F7EED0;--ok:#1E7A46;--okb:#E2F2E7;--warn:#A86F10;--warnb:#FBF0D8;--info:#2E6690;--infob:#E1ECF5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 "Be Vietnam Pro","Segoe UI",Roboto,Arial,sans-serif}
header{background:radial-gradient(120% 90% at 0 0,#0E6242,#063B28 60%,#042C1E);color:#EAF3EE;padding:18px 16px 16px;border-bottom:1px solid rgba(201,162,74,.5)}
.hb{display:flex;gap:12px;align-items:center;max-width:720px;margin:0 auto}.hb img{width:56px;height:56px}
.hb b{display:block;font:700 22px/1.05 "Cormorant Garamond",Georgia,serif;color:#F3E3A6}.hb span{font-size:12.5px;color:#A9C6B3}
nav{display:flex;gap:4px;max-width:720px;margin:14px auto 0;overflow-x:auto}
nav button{border:0;background:rgba(255,255,255,.08);color:#D6E6DC;padding:8px 13px;border-radius:999px;font:inherit;font-size:13.5px;font-weight:500;white-space:nowrap;cursor:pointer}
nav button.on{background:linear-gradient(135deg,#F4E6AE,#C9A24A);color:#33250A}
main{max-width:720px;margin:0 auto;padding:16px 14px 60px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:16px;margin-bottom:12px}
h2{font:700 24px/1.15 "Cormorant Garamond",Georgia,serif;color:var(--em9);margin:4px 0 10px}
label{display:block;font-size:13px;font-weight:500;color:var(--ink2);margin:12px 0 5px}
input,select,textarea{width:100%;font:inherit;font-size:16px;border:1px solid var(--ln);border-radius:10px;padding:10px 12px;background:#fff;color:var(--ink)}
textarea{min-height:120px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:13.5px;color:var(--ink2)}.chk input{width:20px;height:20px;flex:none;margin-top:1px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 18px;font:inherit;font-weight:600;cursor:pointer;background:var(--em);color:#fff;width:100%;margin-top:16px}
.btn.sec{background:#fff;color:var(--em);border:1px solid var(--ln);width:auto;margin-top:0;padding:9px 14px}
.btn[disabled]{opacity:.6}
.muted{color:var(--ink3);font-size:13px}.err{color:#B23A34;font-size:13.5px;margin-top:8px}
.ok{background:var(--okb);border:1px solid #BFE2CB;border-radius:14px;padding:14px;margin-top:12px}
.code{font:700 26px/1.1 "Be Vietnam Pro",sans-serif;letter-spacing:4px;color:var(--em9)}
.msg{border:1px solid var(--ln);border-radius:14px;padding:13px 14px;margin-bottom:10px;background:#fff}
.mh{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--ink3);flex-wrap:wrap}
.mc{margin:6px 0 8px;white-space:pre-line}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600}
.s-gui{background:var(--infob);color:var(--info)}.s-doc{background:var(--g1);color:#8A661B}.s-xl{background:var(--warnb);color:var(--warn)}.s-ph,.s-xong{background:var(--okb);color:var(--ok)}
.steps{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.st{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--ink3)}.st i{width:10px;height:10px;border-radius:50%;border:2px solid var(--ln);display:inline-block}
.st.on{color:var(--ink)}.st.on i{background:var(--em);border-color:var(--em)}
.rp{background:var(--okb);border-radius:10px;padding:9px 12px;font-size:14px;margin-top:8px}
.nt{border-left:3px solid var(--gold);background:linear-gradient(90deg,var(--g1),#fff 70%);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.nt b{display:block;margin:4px 0}.nt p{margin:0;white-space:pre-line;font-size:14px;color:var(--ink2)}
.empty{text-align:center;color:var(--ink3);padding:26px 8px;font-size:14px}
.add{display:flex;gap:8px;margin-top:10px}.add input{text-transform:uppercase}
footer{text-align:center;font-size:12px;color:var(--ink3);padding:10px}
@media (max-width:480px){.row{grid-template-columns:1fr}}
.tb{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}.tb td,.tb th{border-bottom:1px solid var(--ln);padding:7px 4px;text-align:left}.tb td.n,.tb th.n{text-align:right}.tot td{font-weight:700}
.qr{display:block;margin:12px auto;width:220px;height:220px;border:1px solid var(--ln);border-radius:12px;padding:8px;background:#fff}
.slot{display:inline-block;background:var(--warnb);color:var(--warn);border-radius:8px;padding:3px 9px;margin:3px 4px 0 0;font-size:13px;font-weight:600}

.stars{display:flex;gap:4px;margin:6px 0}.stars button{background:none;border:0;font-size:28px;color:#D9D2BD;cursor:pointer;padding:0 2px}.stars button.on{color:#C9A24A}
.rcm{width:100%;border:1px solid var(--ln);border-radius:10px;padding:9px;font:inherit}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sb{border:1px solid var(--ln);border-radius:12px;padding:12px}.sb b{display:block;font-size:26px;font-family:Georgia,serif;color:#063B28}.sb.bad b{color:#B23A34}.sb span{font-size:13px;color:#6A7C71}
.lrow{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--ln);font-size:14px}.late{color:#B23A34}
.hook{margin:4px 0 10px;padding:7px 0 7px 11px;border-left:3px solid #B8892B;color:#063B28;font-weight:600;font-size:16px;line-height:1.45}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
</head>

<nav><button data-t="send" class="on">Gửi tin</button><button data-t="mine">Tin của tôi</button><button data-t="pub">Bảng phản ánh chung</button><button data-t="book">Đặt tiện ích</button><button data-t="fee">Phí của tôi</button><button data-t="guest">Khách đến thăm</button><button data-t="svc">Tình trạng dịch vụ</button><button data-t="st">Tình hình vận hành</button><button data-t="nt">Thông báo</button></nav></header>
<main id="m"></main>
<footer>Ban Quản lý chung cư Saigon South Residences, Phú Mỹ Hưng</footer>
<script>
var TAB='send', LAST=null;
function $(s){return document.querySelector(s)}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fdt(s){if(!s)return'';var d=new Date(String(s).length===10?s+'T00:00':s);if(isNaN(d))return s;function p(n){return String(n).padStart(2,'0')}return p(d.getHours())+':'+p(d.getMinutes())+', '+p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+d.getFullYear()}
function tracks(){try{return JSON.parse(localStorage.getItem('ssr-tracks'))||[]}catch(e){return[]}}
function saveTracks(a){try{localStorage.setItem('ssr-tracks',JSON.stringify(a.slice(0,30)))}catch(e){}}
function call(p){return new Promise(function(res,rej){if(window.google&&google.script&&google.script.run){google.script.run.withSuccessHandler(res).withFailureHandler(function(e){rej(e)}).api(p)}else if(window.SSR_API){fetch(window.SSR_API,{method:'POST',body:JSON.stringify(p)}).then(function(r){return r.json()}).then(res,rej)}else rej(new Error('Chưa kết nối máy chủ'))})}
var SC={'Đã gửi':'s-gui','Đã đọc':'s-doc','Đang xử lý':'s-xl','Đã phản hồi':'s-ph','Đã xong':'s-xong'};
function steps(m){var s=m.status,o=['Đã gửi','Đã đọc','Đang xử lý','Đã phản hồi','Đã xong'],i=o.indexOf(s);function on(k){return k<=i||(k===1&&m.readAt)||(k===3&&m.reply)}
return '<div class="steps">'+['Đã gửi',m.readAt?'Đã đọc '+fdt(m.readAt):'Chưa đọc','Đang xử lý','Đã phản hồi','Đã xong'].map(function(t,k){return '<span class="st'+(on(k)?' on':'')+'"><i></i>'+esc(t)+'</span>'}).join('')+'</div>'}
function card(m,mine){return '<div class="msg"><div class="mh"><span>'+esc(mine?(m.unit||'')+' '+m.id:(m.block||'Không ghi căn'))+'</span><span>'+esc(m.type)+', '+fdt(m.t)+'</span></div><div class="mc">'+esc(m.content)+'</div><span class="pill '+(SC[m.status]||'')+'">'+esc(m.status)+'</span>'+steps(m)+(m.reply?'<div class="rp"><b>Ban Quản lý phản hồi</b> '+(m.replyAt?'<span class="muted">('+fdt(m.replyAt)+')</span>':'')+'<br>'+esc(m.reply)+'</div>':'')+(mine&&m.ticket?rateBox(m):'')+'</div>'}
function vSend(){return '<div class="card"><h2>Gửi tin cho Ban Quản lý</h2><p class="muted" style="margin-top:0">Phản ánh sự cố, góp ý hoặc câu hỏi. Sau khi gửi, bạn theo dõi được tin đã được đọc, đang xử lý hay đã phản hồi.</p>'+
'<label for="ty">Loại tin</label><select id="ty"><option>Phản ánh sự cố</option><option>Góp ý</option><option>Hỏi đáp</option><option>Khác</option></select>'+
'<label for="ct">Nội dung</label><textarea id="ct" maxlength="2000" placeholder="Mô tả sự việc, vị trí, thời gian nếu có"></textarea>'+
'<div class="row"><div><label for="un">Căn hộ</label><input id="un" placeholder="Ví dụ A-12.05" maxlength="8" autocomplete="off"></div><div><label for="ph">Số điện thoại</label><input id="ph" inputmode="tel" maxlength="20"></div></div>'+
'<label for="nm">Họ tên</label><input id="nm" maxlength="80" autocomplete="name">'+
'<label class="chk"><input type="checkbox" id="pb" checked><span>Hiển thị trên bảng phản ánh chung để cư dân khác cùng theo dõi. Tên, số điện thoại và số căn được ẩn, chỉ hiện block.</span></label>'+
'<label for="ph2">Ảnh kèm theo (không bắt buộc)</label><input type="file" id="ph2" accept="image/*"><p class="muted" style="margin:10px 0 0">Họ tên, căn hộ và số điện thoại chỉ dùng để Ban Quản lý liên hệ, xử lý và phản hồi tin của bạn.</p><button class="btn" id="go">Gửi tin</button><div class="err" id="er" hidden></div>'+(LAST?'<div class="ok"><b>Đã gửi thành công.</b><br>Mã theo dõi của bạn<div class="code">'+esc(LAST.track)+'</div><span class="muted">Mã được lưu trên điện thoại này. Nếu đổi máy, nhập lại mã ở mục Tin của tôi.</span></div>':'')+'</div>'}
function load(fn){$('#m').innerHTML='<div class="empty">Đang tải</div>';fn().then(function(h){$('#m').innerHTML=h;bind()},function(e){$('#m').innerHTML='<div class="card"><div class="err">'+esc(e&&e.message||e)+'</div></div>'})}
function show(){document.querySelectorAll('nav button').forEach(function(b){b.classList.toggle('on',b.dataset.t===TAB)});
if(TAB==='book'||TAB==='fee'||TAB==='guest')return showUnit();
if(TAB==='st')return showStatus();
if(TAB==='svc')return showSvc();
if(TAB==='send'){$('#m').innerHTML=vSend();bind();return}
if(TAB==='mine')return load(function(){var t=tracks();if(!t.length)return Promise.resolve('<div class="card"><h2>Tin của tôi</h2><div class="empty">Chưa có tin nào trên điện thoại này.</div>'+addBox()+'</div>');return call({api:'mine',tracks:t}).then(function(r){if(!r.ok)throw new Error(r.error);return '<div class="card"><h2>Tin của tôi</h2>'+(r.items.length?r.items.map(function(m){return card(m,true)}).join(''):'<div class="empty">Không tìm thấy tin theo mã đã lưu.</div>')+addBox()+'</div>'})});
if(TAB==='pub')return load(function(){return call({api:'public'}).then(function(r){if(!r.ok)throw new Error(r.error);return '<div class="card"><h2>Bảng phản ánh chung</h2><p class="muted" style="margin-top:0">Các tin cư dân chọn công khai, kèm thời điểm Ban Quản lý đã đọc và phản hồi.</p>'+(r.items.length?r.items.map(function(m){return card(m,false)}).join(''):'<div class="empty">Chưa có tin công khai.</div>')+'</div>'})});
if(TAB==='nt')return load(function(){return call({api:'notices'}).then(function(r){if(!r.ok)throw new Error(r.error);return '<div class="card"><h2>Thông báo của Ban Quản lý</h2>'+(r.items.length?r.items.map(function(n){return '<div class="nt"><span class="muted">'+esc(n.category)+', '+esc(n.scope)+'</span><b>'+esc(n.title)+'</b><p>'+esc(n.body)+'</p></div>'}).join(''):'<div class="empty">Hiện không có thông báo.</div>')+'</div>'})})}
function addBox(){return '<p class="muted" style="margin:14px 0 0">Nhập mã theo dõi nhận được khi gửi tin từ máy khác</p><div class="add"><input id="tk" maxlength="6" placeholder="Mã 6 ký tự"><button class="btn sec" id="tka">Thêm</button></div>'}
function bind(){var g=$('#go');if(g)g.onclick=function(){var ct=$('#ct').value.trim(),er=$('#er');er.hidden=true;if(ct.length<5){er.textContent='Nội dung quá ngắn.';er.hidden=false;return}var un=$('#un').value.trim().toUpperCase();if(un&&!/^[ABCDEG]-\d{2}\.\d{2}$/.test(un)){er.textContent='Căn hộ ghi theo dạng A-12.05.';er.hidden=false;return}
g.disabled=true;g.textContent='Đang gửi';photoData($('#ph2')).then(function(ph){return call({api:'send',type:$('#ty').value,content:ct,unit:un,phone:$('#ph').value.trim(),name:$('#nm').value.trim(),pub:$('#pb').checked,photo:ph.photo,thumb:ph.thumb})}).then(function(r){if(!r.ok)throw new Error(r.error);var t=tracks();t.unshift(r.track);saveTracks(t);LAST=r;show()},function(e){g.disabled=false;g.textContent='Gửi tin';er.textContent=(e&&e.message)||'Không gửi được, thử lại sau';er.hidden=false})};
var a=$('#tka');if(a)a.onclick=function(){var v=$('#tk').value.trim().toUpperCase();if(!/^[A-Z0-9]{6}$/.test(v))return;var t=tracks();if(t.indexOf(v)<0)t.unshift(v);saveTracks(t);show()}}

function resize(file,max,q){return new Promise(function(res){var img=new Image(),r=new FileReader();r.onload=function(){img.onload=function(){var s=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};img.src=r.result};r.readAsDataURL(file)})}
function photoData(inp){if(!inp||!inp.files||!inp.files[0])return Promise.resolve({});var f=inp.files[0],o={};return resize(f,1280,.8).then(function(d){o.photo=d;return resize(f,240,.6)}).then(function(t){o.thumb=t;return o})}
function unitCfg(){try{return JSON.parse(localStorage.getItem('ssr-unit'))||null}catch(e){return null}}
function money(n){return Math.round(+n||0).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.')+' đ'}
function qrImg(v){try{return new QRious({value:v,size:440,level:'M'}).toDataURL()}catch(e){return''}}
function vdate(s){s=String(s||'');return s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(0,4)}
function todayStr(k){var d=new Date(Date.now()+(k||0)*864e5);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function authBox(msg){return '<div class="card"><h2>Xác nhận căn hộ</h2><p class="muted" style="margin-top:0">Nhập số căn và mã tra cứu in trên giấy báo phí hằng tháng. Mã chỉ cần nhập một lần trên điện thoại này.</p><div class="row"><div><label for="au">Căn hộ</label><input id="au" placeholder="Ví dụ A-12.05" maxlength="8"></div><div><label for="ac">Mã tra cứu</label><input id="ac" maxlength="6" style="text-transform:uppercase"></div></div><button class="btn" id="ao">Xác nhận</button><div class="err" id="er"'+(msg?'':' hidden')+'>'+esc(msg||'')+'</div></div>'}
function authView(msg){$('#m').innerHTML=authBox(msg);$('#ao').onclick=function(){var b=this,x={unit:$('#au').value.trim().toUpperCase(),code:$('#ac').value.trim().toUpperCase()};b.disabled=true;call(Object.assign({api:'fee'},x)).then(function(r){if(!r.ok)throw new Error(r.error);localStorage.setItem('ssr-unit',JSON.stringify(x));showUnit()}).catch(function(e){authView((e&&e.message)||e)})}}
function showUnit(){var u=unitCfg();if(!u)return authView();
var head='<p class="muted" style="margin:0 0 8px">Căn hộ '+esc(u.unit)+'. <a href="#" id="lo">Đổi căn</a></p>';
function fin(h){$('#m').innerHTML='<div class="card">'+head+h+'</div>';var lo=$('#lo');if(lo)lo.onclick=function(){localStorage.removeItem('ssr-unit');showUnit();return false}}
function err(e){var m=(e&&e.message)||e;if(/mã tra cứu|Căn hộ ghi/.test(m)){localStorage.removeItem('ssr-unit');authView(m);return}fin('<div class="err">'+esc(m)+'</div>')}
$('#m').innerHTML='<div class="empty">Đang tải</div>';
if(TAB==='fee')return call(Object.assign({api:'fee'},u)).then(function(r){if(!r.ok)throw new Error(r.error);var q=r.qr?qrImg(r.qr):'';
fin('<h2>Phí tháng '+esc(r.month)+'</h2><table class="tb"><tr><th>Khoản</th><th class="n">Số tiền</th></tr><tr><td>Phí quản lý ('+r.area+' m² x '+money(r.rate).replace(' đ','')+')</td><td class="n">'+money(r.fee)+'</td></tr>'+(r.park?'<tr><td>Phí gửi xe</td><td class="n">'+money(r.park)+'</td></tr>':'')+(r.debt?'<tr><td>Nợ kỳ trước ('+r.debtMonths+' tháng)</td><td class="n">'+money(r.debt)+'</td></tr>':'')+'<tr class="tot"><td>Tổng phải thanh toán</td><td class="n">'+money(r.total)+'</td></tr></table><p class="muted">Hạn thanh toán '+esc(r.due)+'. Số liệu theo lần cập nhật gần nhất của Ban Quản lý; khoản vừa chuyển có thể chưa được ghi nhận.</p>'+
(r.bank?(q?'<img class="qr" src="'+q+'" alt="Mã VietQR"><p class="muted" style="text-align:center">Mở ứng dụng ngân hàng, quét mã. Số tiền và nội dung được điền sẵn.</p>':'')+'<table class="tb"><tr><td>Ngân hàng</td><td class="n">'+esc(r.bank.name)+'</td></tr><tr><td>Số tài khoản</td><td class="n">'+esc(r.bank.acc)+'</td></tr>'+(r.bank.holder?'<tr><td>Chủ tài khoản</td><td class="n">'+esc(r.bank.holder)+'</td></tr>':'')+'<tr><td>Nội dung</td><td class="n"><b>'+esc(r.info)+'</b></td></tr></table>':'<p class="muted">Ban Quản lý chưa công bố tài khoản nhận tiền trên cổng.</p>'))}).catch(err);
if(TAB==='book')return Promise.all([call({api:'portalInfo'}),call(Object.assign({api:'myBook'},u))]).then(function(a){if(!a[0].ok)throw new Error(a[0].error);if(!a[1].ok)throw new Error(a[1].error);var fac=a[0].fac;
fin('<h2>Đặt tiện ích</h2>'+(fac.length?'<label for="bf">Tiện ích</label><select id="bf">'+fac.map(function(f){return '<option value="'+f.id+'">'+esc(f.name)+', '+esc(f.hours)+(f.fee?', '+money(f.fee)+' mỗi giờ':', miễn phí')+'</option>'}).join('')+'</select><label for="bd">Ngày</label><input id="bd" type="date" min="'+todayStr()+'" max="'+todayStr(30)+'" value="'+todayStr()+'"><div id="bs" class="muted" style="margin-top:8px"></div><div class="row"><div><label for="b1">Từ giờ</label><input id="b1" type="time" value="18:00"></div><div><label for="b2">Đến giờ</label><input id="b2" type="time" value="19:00"></div></div><div class="row"><div><label for="bn">Người đặt</label><input id="bn" maxlength="80"></div><div><label for="bp">Số người</label><input id="bp" type="number" min="1" value="2"></div></div><label for="bt">Ghi chú</label><input id="bt" maxlength="300"><button class="btn" id="bo">Gửi yêu cầu đặt chỗ</button><div class="err" id="er" hidden></div>':'<div class="empty">Hiện chưa có tiện ích nhận đặt qua cổng.</div>')+
'<h2 style="margin-top:22px">Yêu cầu của căn hộ</h2>'+(a[1].items.length?a[1].items.map(function(o){return '<div class="msg"><div class="mh"><span>'+esc(o['Mã yêu cầu'])+'</span><span>'+esc(vdate(o['Ngày']))+', '+esc(o['Từ'])+' đến '+esc(o['Đến'])+'</span></div><div class="mc">'+esc(o['Tiện ích'])+'</div><span class="pill '+(o['Trạng thái']==='Đã xác nhận'?'s-ph':o['Trạng thái']==='Từ chối'?'s-gui':'s-xl')+'">'+esc(o['Trạng thái'])+'</span>'+(o['Lý do']?'<div class="rp">'+esc(o['Lý do'])+'</div>':'')+'</div>'}).join(''):'<div class="empty">Chưa có yêu cầu.</div>'));
