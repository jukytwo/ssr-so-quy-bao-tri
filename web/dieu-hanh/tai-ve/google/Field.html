<!DOCTYPE html>
<html lang="vi">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--bg:#F1F5F1;--ln:#DAE3DB;--ink:#14231B;--ink3:#6A7C71;--em:#0B6E47;--em9:#063B28;--gold:#C9A24A;--ok:#1E7A46;--okb:#E2F2E7;--bad:#B23A34;--badb:#F8E0DE;--warnb:#FBF0D8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Segoe UI",Roboto,Arial,sans-serif}
header{background:linear-gradient(160deg,#0E6242,#063B28);color:#F3E3A6;padding:14px 16px;font:700 19px Georgia,serif;border-bottom:2px solid var(--gold)}
header small{display:block;font:400 12.5px Arial,sans-serif;color:#A9C6B3;margin-top:2px}
main{max-width:560px;margin:0 auto;padding:14px}
.card{background:#fff;border:1px solid var(--ln);border-radius:16px;padding:16px;margin-bottom:12px}
h2{margin:0 0 4px;font:700 21px Georgia,serif;color:var(--em9)}.muted{color:var(--ink3);font-size:14px}
label{display:block;font-size:14px;font-weight:600;margin:14px 0 6px}
input,select,textarea{width:100%;font:inherit;border:1px solid var(--ln);border-radius:12px;padding:12px;background:#fff}
textarea{min-height:80px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font:inherit;font-weight:700;margin-top:16px;background:var(--em);color:#fff;cursor:pointer}
.btn.sec{background:#fff;color:var(--em);border:1px solid var(--ln)}.btn.red{background:var(--bad)}.btn[disabled]{opacity:.55}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}.seg button{border:1px solid var(--ln);background:#fff;border-radius:12px;padding:12px 6px;font:inherit;font-size:14px;font-weight:600}
.seg button.on{background:var(--em);color:#fff;border-color:var(--em)}.seg button.bad.on{background:var(--bad);border-color:var(--bad)}
.ok{background:var(--okb);border-radius:14px;padding:16px;font-weight:600;color:var(--ok);text-align:center}
.err{background:var(--badb);color:var(--bad);border-radius:12px;padding:12px;margin-top:12px;font-size:14.5px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:15px;margin-top:8px}.kv b{font-weight:600}
.big{font-size:30px;font-weight:700;letter-spacing:2px;color:var(--em9)}
.st{display:inline-block;padding:3px 12px;border-radius:999px;font-size:13px;font-weight:700;background:var(--warnb)}
.st.in{background:var(--okb);color:var(--ok)}.st.out{background:#eee}
img.pv{max-width:100%;border-radius:12px;margin-top:10px}
</style>
</head>
<body>
<header>Saigon South Residences<small id="sub">Ghi nhận hiện trường</small></header>
<main id="m"><div class="card muted">Đang tải</div></main>
<script>
var P={}, CFG=JSON.parse(localStorage.getItem('ssr-field')||'{}'), PHOTO=null, THUMB=null, RES='Bình thường';
function $(s){return document.querySelector(s)}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fdt(s){if(!s)return'';s=String(s);return s.slice(11,16)+', '+s.slice(8,10)+'/'+s.slice(5,7)}
function call(p){p.pin=CFG.pin;return new Promise(function(res,rej){if(window.google&&google.script&&google.script.run)google.script.run.withSuccessHandler(res).withFailureHandler(rej).api(p);else if(window.SSR_API)fetch(window.SSR_API,{method:'POST',body:JSON.stringify(p)}).then(function(r){return r.json()}).then(res,rej);else rej(new Error('Chưa kết nối máy chủ'))})}
function fail(e){var el=$('#er');var t=(e&&e.message)||e||'Có lỗi xảy ra';if(el){el.textContent=t;el.hidden=false}else $('#m').innerHTML='<div class="card"><div class="err">'+esc(t)+'</div><button class="btn sec" onclick="resetCfg()">Nhập lại mã hiện trường</button></div>'}
function resetCfg(){CFG={};localStorage.removeItem('ssr-field');start()}
function setup(){$('#m').innerHTML='<div class="card"><h2>Mã hiện trường</h2><p class="muted">Nhập một lần trên điện thoại này. Ban Quản lý cấp mã cho bảo vệ và kỹ thuật.</p><label>Mã hiện trường</label><input id="pin" inputmode="numeric" maxlength="8"><label>Tên của bạn</label><input id="who" maxlength="60" value="'+esc(CFG.who||'')+'"><button class="btn" id="sv">Lưu</button><div class="err" id="er" hidden></div></div>';
$('#sv').onclick=function(){var pin=$('#pin').value.trim(),who=$('#who').value.trim();if(!pin||who.length<2){fail('Nhập đủ mã và tên');return}CFG={pin:pin,who:who};localStorage.setItem('ssr-field',JSON.stringify(CFG));start()}}
function resize(file,max,q){return new Promise(function(res){var img=new Image(),r=new FileReader();r.onload=function(){img.onload=function(){var s=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};img.src=r.result};r.readAsDataURL(file)})}
function photoBox(){return '<label>Ảnh (không bắt buộc)</label><input type="file" id="ph" accept="image/*" capture="environment"><img id="pv" class="pv" hidden>'}
function bindPhoto(){var f=$('#ph');if(!f)return;f.onchange=function(){if(!f.files[0])return;resize(f.files[0],1280,.8).then(function(d){PHOTO=d;$('#pv').src=d;$('#pv').hidden=false;return resize(f.files[0],240,.6)}).then(function(t){THUMB=t})}}
function seg(opts){return '<div class="seg">'+opts.map(function(o,i){return '<button type="button" class="'+(o==='Hỏng'||o==='Bất thường'?'bad ':'')+(i===0?'on':'')+'" data-r="'+o+'">'+o+'</button>'}).join('')+'</div>'}
function bindSeg(){document.querySelectorAll('.seg button').forEach(function(b){b.onclick=function(){document.querySelectorAll('.seg button').forEach(function(x){x.classList.toggle('on',x===b)});RES=b.dataset.r}})}
function done(msg){$('#m').innerHTML='<div class="card"><div class="ok">'+esc(msg)+'</div><p class="muted" style="text-align:center">Người ghi: '+esc(CFG.who)+'. Có thể đóng trang này.</p></div>'}
function outages(){$('#sub').textContent='Sự cố dịch vụ';$('#m').innerHTML='<div class="card muted">Đang tải</div>';call({api:'fieldOutages'}).then(function(r){if(!r.ok)throw new Error(r.error);
var h=r.items.map(function(o){return '<div class="card"><div style="display:flex;justify-content:space-between;gap:8px"><b>'+esc(o.code)+': '+esc(o.service)+'</b><span class="st'+(o.status==='Đang diễn ra'?' in':'')+'">'+esc(o.status)+'</span></div><div class="muted">Block '+esc(o.blocks)+', tầng '+esc(o.floors)+'</div><div class="muted">'+(o.status==='Đang diễn ra'?'Ngưng từ '+fdt(o.actualStart||o.planStart)+(o.planEnd?', hẹn có lại '+fdt(o.planEnd):''):'Theo thông báo: '+fdt(o.planStart)+' đến '+fdt(o.planEnd))+'</div>'+(o.cause?'<div class="muted">'+esc(o.cause)+'</div>':'')+'<button class="btn" data-oc="'+esc(o.code)+'" data-oa="'+(o.status==='Đang diễn ra'?'end':'start')+'" style="margin-top:10px">'+(o.status==='Đang diễn ra'?'Đã có lại lúc này':'Bắt đầu ngưng lúc này')+'</button></div>'}).join('');
$('#m').innerHTML=(h||'<div class="card muted">Không có gián đoạn đang diễn ra hoặc sắp diễn ra.</div>')+'<div class="card"><h2>Báo sự cố đột xuất</h2><label>Dịch vụ</label><select id="os"><option>Nước</option><option>Điện</option><option>Thang máy</option><option>Cửa và thẻ</option><option>Khác</option></select><label>Block bị ảnh hưởng</label><input id="ob" placeholder="Ví dụ: D hoặc Toàn khu"><label>Tầng</label><input id="of" placeholder="Ví dụ: 10-20 hoặc Tất cả"><label>Nguyên nhân, hiện trạng</label><input id="oc" placeholder="Ví dụ: bể ống đứng"><label>Người báo</label><input id="ow" value="'+esc(CFG.who||'')+'"><div class="err" id="er" hidden></div><button class="btn" id="onew" style="margin-top:10px">Gửi báo sự cố</button></div>';
document.querySelectorAll('[data-oc]').forEach(function(b){b.onclick=function(){b.disabled=true;call({api:'outageEvent',act:b.dataset.oa,code:b.dataset.oc,who:CFG.who||''}).then(function(x){if(!x.ok)throw new Error(x.error);outages()}).catch(function(e){b.disabled=false;alert(e.message||e)})}});
$('#onew').onclick=function(){var w=$('#ow').value.trim();CFG.who=w;localStorage.setItem('ssr-field',JSON.stringify(CFG));this.disabled=true;var me=this;call({api:'outageEvent',act:'new',service:$('#os').value,blocks:$('#ob').value.trim(),floors:$('#of').value.trim(),cause:$('#oc').value.trim(),who:w}).then(function(x){if(!x.ok)throw new Error(x.error);outages()}).catch(function(e){me.disabled=false;fail(e)})}}).catch(fail)}

function start(){if(!CFG.pin)return setup();var type=P.cp?'cp':P.tb?'tb':P.m?'m':P.g?'g':'';var ref=P.cp||P.tb||P.m||P.g;if(!type)return outages();
call({api:'fieldInfo',type:type,ref:ref}).then(function(r){if(!r.ok)throw new Error(r.error);RES='Bình thường';PHOTO=null;THUMB=null;
if(type==='g'){var g=r.guest,st=g['Giờ ra']?'<span class="st out">Đã ra '+fdt(g['Giờ ra'])+'</span>':g['Giờ vào']?'<span class="st in">Đã vào '+fdt(g['Giờ vào'])+'</span>':'<span class="st">Chưa vào</span>';$('#sub').textContent='Khách đăng ký trước';
$('#m').innerHTML='<div class="card"><div class="big">'+esc(g['Mã khách'])+'</div>'+st+'<div class="kv"><span>Căn hộ</span><b>'+esc(g['Căn hộ'])+'</b><span>Khách</span><b>'+esc(g['Tên khách'])+'</b><span>Loại</span><b>'+esc(g['Loại'])+'</b><span>Biển số</span><b>'+esc(g['Biển số']||'Không')+'</b><span>Ngày</span><b>'+esc(g['Ngày'].slice(8,10)+'/'+g['Ngày'].slice(5,7)+'/'+g['Ngày'].slice(0,4))+'</b><span>Khung giờ</span><b>'+esc(g['Từ giờ'])+' đến '+esc(g['Đến giờ'])+'</b></div>'+(g['Ghi chú']?'<p class="muted">'+esc(g['Ghi chú'])+'</p>':'')+
(!g['Giờ vào']?'<label>Cổng</label><select id="gt"><option>Cổng 1</option><option>Cổng 2</option><option>Lối xuống hầm</option></select><button class="btn" id="gi">Cho vào</button>':!g['Giờ ra']?'<button class="btn sec" id="go">Ghi nhận ra</button>':'')+'<div class="err" id="er" hidden></div></div>';
if($('#gi'))$('#gi').onclick=function(){this.disabled=true;call({api:'guestIn',g:ref,gate:$('#gt').value,who:CFG.who}).then(function(x){if(!x.ok)throw new Error(x.error);done('Đã ghi nhận khách vào lúc '+new Date().toTimeString().slice(0,5))}).catch(function(e){$('#gi').disabled=false;fail(e)})};
if($('#go'))$('#go').onclick=function(){this.disabled=true;call({api:'guestOut',g:ref,who:CFG.who}).then(function(x){if(!x.ok)throw new Error(x.error);done('Đã ghi nhận khách ra')}).catch(fail)};return}
var i=r.info,lab={cp:'Điểm tuần tra',tb:'Thiết bị',m:'Công tơ'}[type];$('#sub').textContent=lab;
var h='<div class="card"><span class="muted">'+lab+' '+esc(r.ref)+'</span><h2>'+esc(i[0])+'</h2><div class="muted">'+esc(type==='m'?i[2]:i[1])+(type==='tb'&&i[2]?', tình trạng hiện tại: '+esc(i[2]):'')+'</div>'+(r.last?'<p class="muted">Lần ghi gần nhất: '+fdt(r.last.t)+', '+esc(r.last.who)+(r.last.value?', chỉ số '+esc(r.last.value):'')+(r.last.result?', '+esc(r.last.result):'')+'</p>':'')+'</div><div class="card">';
if(type==='cp')h+='<label>Tình trạng tại điểm</label>'+seg(['Bình thường','Bất thường']);
if(type==='tb')h+='<label>Kết quả kiểm tra</label>'+seg(['Bình thường','Cần theo dõi','Hỏng']);
if(type==='m')h+='<label>Chỉ số hiện tại ('+esc(i[1])+')</label><input id="val" type="number" inputmode="decimal" step="any">';
h+='<label>Ghi chú</label><textarea id="nt" maxlength="500"></textarea>'+photoBox()+'<button class="btn" id="sb">'+(type==='cp'?'Xác nhận đã tuần tra':'Gửi ghi nhận')+'</button><div class="err" id="er" hidden></div><p class="muted">Người ghi: '+esc(CFG.who)+' <a href="#" onclick="resetCfg();return false">Đổi</a></p></div>';
$('#m').innerHTML=h;bindSeg();bindPhoto();
$('#sb').onclick=function(){var b=this;b.disabled=true;var p={api:'fieldlog',type:{cp:'Tuần tra',tb:'Kiểm tra thiết bị',m:'Chỉ số công tơ'}[type],ref:r.ref,who:CFG.who,result:type==='m'?'':RES,value:type==='m'?$('#val').value:'',note:$('#nt').value.trim(),photo:PHOTO,thumb:THUMB};
call(p).then(function(x){if(!x.ok)throw new Error(x.error);done(type==='cp'?'Đã ghi nhận tuần tra lúc '+new Date().toTimeString().slice(0,5):'Đã gửi ghi nhận, cảm ơn anh chị')}).catch(function(e){b.disabled=false;fail(e)})}}).catch(fail)}
if(window.google&&google.script&&google.script.url)google.script.url.getLocation(function(l){P=l.parameter||{};start()});
else{location.search.slice(1).split('&').forEach(function(kv){var a=kv.split('=');if(a[0])P[a[0]]=decodeURIComponent(a[1]||'')});start()}
</script>
</body>
</html>
