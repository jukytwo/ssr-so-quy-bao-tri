<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="SSR">
<meta name="theme-color" content="#063B28">
<title>SSR Điều Hành | Trung tâm quản trị Saigon South Residences</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
<style data-keep>
:root{
  --bg:#F1F5F1;--surface:#FFFFFF;--surface-2:#F6F9F6;--line:#DAE3DB;--line-2:#E9EFEA;
  --ink:#14231B;--ink-2:#3F5347;--ink-3:#6A7C71;--title:#063B28;
  --em-950:#042C1E;--em-900:#063B28;--em-800:#0A5337;--em-700:#0B6E47;--em-600:#128157;--em-500:#1D9A66;--em-100:#DCEFE3;--em-50:#EDF6F0;
  --gold-700:#8A661B;--gold-600:#AD872C;--gold-500:#C9A24A;--gold-300:#E8D38F;--gold-100:#F7EED0;
  --ok:#1E7A46;--ok-bg:#E2F2E7;--warn:#A86F10;--warn-bg:#FBF0D8;--hot:#C0531A;--hot-bg:#FCE6D8;--bad:#B23A34;--bad-bg:#F8E0DE;--info:#2E6690;--info-bg:#E1ECF5;
  --gold-grad:linear-gradient(135deg,#F4E6AE 0%,#D3AE55 38%,#A27A26 68%,#E8D08A 100%);
  --shadow:0 1px 2px rgba(6,59,40,.05),0 10px 28px -14px rgba(6,59,40,.28);
  --r-lg:16px;--r-md:10px;--r-sm:6px;
  --f-ui:"Be Vietnam Pro","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-disp:"Cormorant Garamond","Times New Roman",Georgia,serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1510;--surface:#121E17;--surface-2:#17251C;--line:#26382C;--line-2:#1D2C22;
  --ink:#E3ECE5;--ink-2:#B3C3B8;--ink-3:#879A8D;--title:#EAD696;
  --em-100:#1A3526;--em-50:#13241A;--em-600:#3FAF7A;--em-500:#4FC08A;
  --ok:#57C487;--ok-bg:#12301F;--warn:#E3AE4F;--warn-bg:#33280E;--hot:#EF8B55;--hot-bg:#3A2213;--bad:#EF7D75;--bad-bg:#3A1917;--info:#72AAD8;--info-bg:#122838;
  --gold-100:#3A3016;--gold-700:#E3C877;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0B1510;--surface:#121E17;--surface-2:#17251C;--line:#26382C;--line-2:#1D2C22;
  --ink:#E3ECE5;--ink-2:#B3C3B8;--ink-3:#879A8D;--title:#EAD696;
  --em-100:#1A3526;--em-50:#13241A;--em-600:#3FAF7A;--em-500:#4FC08A;
  --ok:#57C487;--ok-bg:#12301F;--warn:#E3AE4F;--warn-bg:#33280E;--hot:#EF8B55;--hot-bg:#3A2213;--bad:#EF7D75;--bad-bg:#3A1917;--info:#72AAD8;--info-bg:#122838;
  --gold-100:#3A3016;--gold-700:#E3C877;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6);
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 14px/1.55 var(--f-ui);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
img,svg{max-width:100%}
a{color:var(--em-600)}
:focus-visible{outline:2px solid var(--gold-500);outline-offset:2px}
.i{width:18px;height:18px;flex:none}
.muted{color:var(--ink-3)}.small{font-size:12.5px}.b{font-weight:600}
.mt{margin-top:18px}.mt-s{margin-top:10px}.right{text-align:right}
.nowrap{white-space:nowrap}.tnum{font-variant-numeric:tabular-nums}
.pos{color:var(--ok)}.neg{color:var(--bad)}

/* shell */
.app{display:grid;grid-template-columns:262px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow-y:auto;background:radial-gradient(130% 55% at 0% 0%,#0E6242 0%,#063B28 52%,#042C1E 100%);color:#E6F0EA;display:flex;flex-direction:column;border-right:1px solid rgba(201,162,74,.4);z-index:40}
.brand{display:flex;align-items:center;gap:12px;padding:22px 18px 16px;text-decoration:none;color:inherit}
.brand img{width:60px;height:60px;filter:drop-shadow(0 5px 12px rgba(0,0,0,.4))}
.brand b{display:block;font:600 21px/1.02 var(--f-disp);color:#F3E3A6}
.brand span{display:block;font-size:12px;color:#A6C3B1;margin-top:4px;line-height:1.35}
.nav{padding:4px 12px 14px;flex:1}
.nav h6{margin:16px 10px 6px;font:500 12px/1 var(--f-ui);color:#86A994}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;margin:1px 0;border-radius:10px;color:#D3E4D9;text-decoration:none;font-weight:500;position:relative}
.nav a .i{opacity:.8}
.nav a:hover{background:rgba(255,255,255,.06)}
.nav a.on{background:linear-gradient(90deg,rgba(233,211,143,.17),rgba(233,211,143,.03));color:#FFF5D6}
.nav a.on .i{opacity:1;color:#E9D38F}
.nav a.on::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--gold-grad)}
.nav .cnt{margin-left:auto;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:999px;background:rgba(255,255,255,.1);color:#EAF3EE}
.nav .cnt.hot{background:#C8453D;color:#fff}
.side-foot{padding:14px 16px 18px;border-top:1px solid rgba(255,255,255,.08);font-size:12px;color:#95B3A1}
.role-card{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:rgba(0,0,0,.2);border:1px solid rgba(233,211,143,.22);margin-bottom:10px;cursor:pointer;width:100%;text-align:left;color:#EAF3EE}
.role-card .i{color:#E9D38F}
.role-card b{display:block;font-size:13px}.role-card span{display:block;font-size:11.5px;color:#9FBCA9}
.scrim{display:none}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:10px;padding:11px 28px;background:var(--bg);background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line-2)}
.iconbtn.menu-btn{display:none}
.gs{position:relative;flex:1;max-width:460px}
.gs .i{position:absolute;left:11px;top:9px;color:var(--ink-3)}
.gs input{width:100%;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 12px 0 36px}
.gs-res{position:absolute;left:0;right:0;top:42px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;z-index:50}
.gs-res button{display:flex;gap:10px;width:100%;text-align:left;padding:9px 12px;border:0;background:none;cursor:pointer;border-bottom:1px solid var(--line-2)}
.gs-res button:hover,.gs-res button:focus{background:var(--em-50)}
.gs-res small{color:var(--ink-3);display:block}
.top-sp{flex:1}
.iconbtn{position:relative;display:inline-grid;place-items:center;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--ink-2)}
.iconbtn:hover{border-color:var(--em-500);color:var(--em-700)}
.iconbtn .dot{position:absolute;top:-6px;right:-6px;min-width:19px;height:19px;padding:0 5px;border-radius:999px;font-size:11px;font-weight:700;display:grid;place-items:center;background:var(--gold-500);color:#2F2303}
.iconbtn .dot.l3{background:#C8453D;color:#fff;animation:ring 1.6s infinite}
.rolepill{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;color:var(--ink-2)}
.rolepill.adm{border-color:var(--gold-500);background:var(--gold-100);color:var(--gold-700)}
#view{padding:26px 30px 70px;width:100%;max-width:1480px}

/* page head */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:14px 20px;flex-wrap:wrap;margin-bottom:20px}
.ph h1{margin:0;font:600 38px/1.02 var(--f-disp);color:var(--title);letter-spacing:.1px}
.ph p{margin:7px 0 0;color:var(--ink-3);max-width:70ch}
.ph p.hook{margin:9px 0 0;max-width:78ch;padding:7px 0 7px 12px;border-left:3px solid var(--gold-700);color:var(--title);font-weight:600;font-size:16.5px;line-height:1.45}.ph p.hook a{font-weight:500;font-size:13.5px;color:var(--em-600);margin-left:4px;white-space:nowrap}.rep .hk{margin:12px 0 4px;padding:9px 13px;border-left:4px solid #B8892B;background:#F6F2E7;color:#063B28;font-weight:700;font-size:16.5px;line-height:1.45}.rep .hk span{display:block;font-weight:400;font-size:13px;color:#3A4A40;margin-top:3px}.ph:has(h1){display:flex;border:0;border-radius:0;background:none;overflow:visible}.demo-note{margin:0 0 14px;padding:9px 13px;border:1px solid #E7C97A;background:#FFF6DC;color:#5C4300;border-radius:10px;font-size:13.5px;line-height:1.5}.demo-note b{color:#7A5600}@media print{.demo-note{display:none}}.bnav{display:none}@media (max-width:960px){.bnav{position:fixed;left:0;right:0;bottom:0;z-index:80;display:flex;background:var(--surface);border-top:1px solid var(--line-2);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 18px rgba(3,28,19,.07)}.bnav a,.bnav button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px 5px;font:600 11px/1.15 var(--f-ui);color:var(--ink-3);text-decoration:none;background:none;border:0;position:relative;border-radius:12px;cursor:pointer;-webkit-tap-highlight-color:transparent}.bnav .i{width:23px;height:23px}.bnav .on{color:var(--em-600)}.bnav .on .i{stroke-width:2.2}.bnav .on::before{content:'';position:absolute;top:-4px;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--gold-700)}.bnav i{position:absolute;top:1px;left:calc(50% + 5px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:#C0392B;color:#fff;font:700 10px/17px var(--f-ui);font-style:normal;text-align:center}body{padding-bottom:calc(66px + env(safe-area-inset-bottom,0px))}#toast-root{bottom:calc(env(safe-area-inset-bottom,0px) + 80px)}.top .gs.gs{flex:1;min-width:0;width:auto;max-width:none}.top .gs.gs input{width:100%}.top .top-sp{display:none}.top .menu-btn,.top [data-act=theme-cycle],.top .iconbtn[data-act=go][data-r=canh-bao]{display:none!important}}@media print{.bnav{display:none!important}}.hero>*{min-width:0}.hero .chips{flex-wrap:wrap}.hd-i.hd-i{grid-template-columns:22px minmax(0,1fr) auto}.hd-i.hd-i b{max-width:100%}.hd-i.hd-i>*{min-width:0}.hd-i.hd-i>div>span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.g>*{min-width:0}@media (max-width:960px){.g2.g2{grid-template-columns:minmax(0,1fr)}.seg{max-width:100%}}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap}

/* panels */
.pn{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 20px}
.pn-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.pn h3,.h3{margin:0;font:600 22px/1.15 var(--f-disp);color:var(--title)}
.pn-h a,.lnk{font-size:13px;font-weight:500;color:var(--em-600);cursor:pointer;background:none;border:0;padding:0;text-decoration:none}
.lnk:hover{text-decoration:underline}
.g{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-hero{grid-template-columns:minmax(0,1.85fr) minmax(290px,1fr);align-items:stretch}
.g-21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}

/* strip */
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.strip>div{padding:14px 18px;box-shadow:inset -1px 0 var(--line-2),inset 0 -1px var(--line-2)}
.strip .sv{font:600 25px/1.15 var(--f-ui);font-variant-numeric:tabular-nums;color:var(--ink);margin-top:2px}
.strip .sl{font-size:12.5px;color:var(--ink-3);font-weight:500}
.strip .ss{font-size:12px;color:var(--ink-3);margin-top:2px}
.strip .sv.bad{color:var(--bad)}.strip .sv.ok{color:var(--ok)}.strip .sv.warn{color:var(--warn)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:37px;padding:0 14px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:500;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--em-500)}
.btn .i{width:16px;height:16px}
.btn.pri{background:var(--em-700);border-color:var(--em-700);color:#fff}
.btn.pri:hover{background:var(--em-800)}
.btn.gold{background:var(--gold-grad);border-color:#A9822B;color:#33250A;font-weight:600}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{height:30px;padding:0 10px;font-size:13px;border-radius:8px}
.btn.danger{color:var(--bad)}
.btn.danger:hover{border-color:var(--bad)}
.btn.ic{width:36px;padding:0}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* forms */
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
.fg .w2{grid-column:1/-1}
.fld label{display:block;font-size:12.5px;color:var(--ink-2);font-weight:500;margin-bottom:5px}
.fld small{display:block;color:var(--ink-3);font-size:11.5px;margin-top:4px}
.req{color:var(--bad);font-style:normal}
.in{width:100%;height:38px;padding:0 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-width:0}
textarea.in{height:auto;min-height:84px;padding:9px 11px;resize:vertical}
.in:focus{outline:none;border-color:var(--em-500);box-shadow:0 0 0 3px color-mix(in srgb,var(--em-500) 20%,transparent)}
.in[disabled]{background:var(--surface-2);color:var(--ink-2)}
.in.sm{height:34px;width:auto;font-size:13.5px}
.in.err{border-color:var(--bad)}
.fbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:16px 0 12px}
.fbar .grow{flex:1;min-width:190px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{white-space:nowrap;border:0;background:none;padding:0 12px;height:34px;cursor:pointer;font-weight:500;color:var(--ink-3);display:inline-flex;align-items:center;gap:6px}
.seg button.on{background:var(--em-700);color:#fff}

/* table */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface)}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
.t th{background:var(--surface-2);text-align:left;font-weight:600;font-size:12.5px;color:var(--ink-2);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:10px 12px;border-bottom:1px solid var(--line-2);vertical-align:top}
.t tbody tr:last-child td{border-bottom:0}
.t tbody tr[data-act]{cursor:pointer}
.t tbody tr[data-act]:hover td{background:var(--em-50)}
.t .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.t .sub{display:block;color:var(--ink-3);font-size:12px;margin-top:1px}
.t .sub.late{color:var(--bad)}.t .sub.soon{color:var(--warn)}.t .sub.pos{color:var(--ok)}
.t td.wide{min-width:250px}.t td.mid{min-width:150px}
.t tr.empty td{text-align:center;color:var(--ink-3);padding:28px}
.t tfoot td{background:var(--surface-2);font-weight:600;border-top:1px solid var(--line)}
.code{font-weight:600;color:var(--em-600);font-variant-numeric:tabular-nums;white-space:nowrap}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;font-size:13px;color:var(--ink-3);flex-wrap:wrap}
.pager .pg{display:flex;gap:4px}

/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line-2)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.pill.nd::before{display:none}
.p-ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.p-warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.p-hot{background:var(--hot-bg);color:var(--hot);border-color:transparent}
.p-bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.p-info{background:var(--info-bg);color:var(--info);border-color:transparent}
.p-gold{background:var(--gold-100);color:var(--gold-700);border-color:transparent}
.p-mute{color:var(--ink-3)}
.lv{display:inline-flex;align-items:center;gap:6px;padding:2px 9px 2px 7px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.lv::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.lv3{background:#B8342E;color:#fff}.lv3::before{background:#fff;animation:ping 1.4s infinite}
.lv2{background:var(--hot-bg);color:var(--hot)}
.lv1{background:var(--warn-bg);color:var(--warn)}
.lv0{background:var(--info-bg);color:var(--info)}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(255,255,255,.85)}70%{box-shadow:0 0 0 6px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
@keyframes ring{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.late{color:var(--bad);font-weight:600}.soon{color:var(--warn);font-weight:600}

/* alarm ribbon */
.ribbon{display:flex;gap:14px;align-items:center;padding:12px 16px;border-radius:var(--r-lg);margin-bottom:18px;background:var(--bad-bg);border:1px solid color-mix(in srgb,var(--bad) 35%,transparent);flex-wrap:wrap}
.ribbon.l2{background:var(--hot-bg);border-color:color-mix(in srgb,var(--hot) 35%,transparent)}
.ribbon .rb-t{display:flex;align-items:center;gap:10px;font-weight:600;color:var(--bad)}
.ribbon.l2 .rb-t{color:var(--hot)}
.ribbon .rb-items{display:flex;gap:8px;flex-wrap:wrap;flex:1}
.ribbon .rb-items button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:12.5px;cursor:pointer;color:var(--ink)}

/* site map hero */
.map-wrap{position:relative;border-radius:var(--r-lg);background:linear-gradient(160deg,#0D6444 0%,#084A31 55%,#063B28 100%);padding:18px 18px 12px;border:1px solid rgba(201,162,74,.6);color:#EAF3EE;box-shadow:var(--shadow);overflow:hidden}
.map-wrap::after{content:"";position:absolute;inset:6px;border-radius:12px;border:1px solid rgba(233,211,143,.22);pointer-events:none}
.map-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;position:relative;z-index:1}
.map-h h3{margin:0;font:600 25px/1.1 var(--f-disp);color:#F1DF9E}
.map-h p{margin:2px 0 0;font-size:12.5px;color:#A9C6B3}
.map svg{display:block;width:100%;height:auto;margin-top:6px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:#B9D3C2;margin-top:6px;position:relative;z-index:1}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.blk,.hit{cursor:pointer}
.blk .blk-body{fill:#0F7A50;stroke:#E4CB7C;stroke-width:1.4;transition:fill .15s}
.blk:hover .blk-body,.blk:focus .blk-body{fill:#139062}
.blk:focus{outline:none}.blk:focus .blk-body{stroke-width:3}
.blk .blk-roof{fill:none;stroke:rgba(233,211,143,.35);stroke-dasharray:3 4}
.blk .blk-l{font:700 60px var(--f-disp);fill:url(#gg)}
.blk .blk-t{font:600 17px var(--f-ui);fill:#FFF7DE}
.blk .blk-s{font:400 13px var(--f-ui);fill:#BFE0CC}
.blk .blk-s2{font:600 13px var(--f-ui);fill:#F1DF9E}
.bdg circle{stroke:#063B28;stroke-width:3}
.bdg text{font:700 14px var(--f-ui);text-anchor:middle}
.bdg.lv3 circle{fill:#D2433B}.bdg.lv3 text{fill:#fff}
.bdg.lv2 circle{fill:#EE8A4E}.bdg.lv2 text{fill:#2B1305}
.bdg.lv1 circle{fill:#F0C45C}.bdg.lv1 text{fill:#2B1F05}
.bdg.lvn circle{fill:#CFEBD9}.bdg.lvn text{fill:#063B28}
.bdg.lv3 .pulse{fill:none;stroke:#FF6B5F;stroke-width:2;animation:pz 1.6s infinite;transform-box:fill-box;transform-origin:center}
@keyframes pz{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.9)}}
.mlab{font:600 13px var(--f-ui);fill:#FFF7DE;pointer-events:none}
.mlab.dk{fill:#073F29}
.msub{font:400 11px var(--f-ui);fill:#CFE6D8;pointer-events:none}
.chip rect{fill:rgba(4,44,30,.72);stroke:#D9BD6A;stroke-width:1}
.chip text{font:500 11.5px var(--f-ui);fill:#F3E3A6}
.chip:hover rect{fill:#0B5C3C}
.hit:hover .hl{filter:brightness(1.12)}
.maint{font:600 11px var(--f-ui);fill:#FFE3A1}

/* today panel */
.vit{display:flex;flex-direction:column}
.vit button{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;text-align:left;border:0;background:none;padding:11px 4px;border-bottom:1px solid var(--line-2);cursor:pointer;color:inherit;border-radius:8px}
.vit button:last-child{border-bottom:0}
.vit button:hover{background:var(--em-50)}
.vit .vi{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--em-50);color:var(--em-600)}
.vit .vl{font-size:13px;color:var(--ink-2);font-weight:500}
.vit .vs{font-size:12px;color:var(--ink-3)}
.vit .vv{font:600 20px/1.1 var(--f-ui);font-variant-numeric:tabular-nums;text-align:right}
.vit .vv small{display:block;font-size:11.5px;font-weight:500;color:var(--ink-3)}

/* charts */
.bars{display:flex;align-items:flex-end;gap:8px;height:170px;border-bottom:1px solid var(--line);padding-top:8px}
.bars .col{flex:1;display:flex;gap:3px;align-items:flex-end;height:100%;min-width:0}
.bars .bar{flex:1;border-radius:4px 4px 0 0;min-height:2px;position:relative}
.bars .bar:hover{filter:brightness(1.1)}
.bars-x{display:flex;gap:8px;margin-top:6px}
.bars-x span{flex:1;text-align:center;font-size:11px;color:var(--ink-3);min-width:0;white-space:nowrap}
.keys{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-3);margin-bottom:8px}
.keys i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.hb{display:grid;grid-template-columns:minmax(96px,auto) minmax(60px,1fr) auto;gap:9px 12px;align-items:center;font-size:13px}
.hb .tr{height:10px;border-radius:5px;background:var(--line-2);position:relative;overflow:visible}
.hb .fi{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--em-600)}
.hb .mk{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink-2);border-radius:1px}
.hb .v{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;color:var(--ink-2)}
.donut-row{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.donut{width:132px;height:132px;border-radius:50%;display:grid;place-items:center;flex:none}
.donut>div{width:96px;height:96px;border-radius:50%;background:var(--surface);display:grid;place-items:center;text-align:center}
.donut b{font:600 24px/1 var(--f-ui);display:block}
.donut span{font-size:11px;color:var(--ink-3)}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 14px;font-size:13px;flex:1;min-width:160px}
.kv dt{color:var(--ink-3)}.kv dd{margin:0;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.gauge{height:10px;border-radius:5px;background:var(--line-2);overflow:hidden;margin-top:8px}
.gauge>i{display:block;height:100%;border-radius:5px;background:var(--em-600)}

/* lists */
.ls{display:flex;flex-direction:column}
.ls .li{display:flex;gap:12px;align-items:flex-start;padding:10px 2px;border-bottom:1px solid var(--line-2);cursor:pointer}
.ls .li:last-child{border-bottom:0}
.ls .li:hover{background:var(--em-50)}
.ls .dt{flex:none;width:48px;text-align:center;border-radius:9px;background:var(--em-50);padding:4px 0;font-size:11px;color:var(--ink-3);line-height:1.2}
.ls .dt b{display:block;font-size:17px;color:var(--em-600)}
.ls .lt{flex:1;min-width:0}
.ls .lt b{display:block;font-weight:500}
.ls .lt span{font-size:12px;color:var(--ink-3)}
.empty-s{padding:22px 8px;text-align:center;color:var(--ink-3);font-size:13px}

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--ink-3);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;margin-bottom:-1px}
.tabs button.on{color:var(--title);border-bottom-color:var(--gold-500)}

/* kanban */
.kb{display:grid;grid-template-columns:repeat(4,minmax(250px,1fr));gap:14px;overflow-x:auto;padding-bottom:6px}
.kc{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:12px;min-height:200px}
.kc h4{margin:0 0 4px;font-size:13.5px;display:flex;justify-content:space-between;color:var(--ink-2)}
.kcard{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--em-600);border-radius:10px;padding:10px 12px;margin-top:8px;cursor:pointer}
.kcard:hover{box-shadow:var(--shadow)}
.kcard.pr-0{border-left-color:#B8342E}.kcard.pr-1{border-left-color:var(--hot)}.kcard.pr-2{border-left-color:var(--gold-500)}.kcard.pr-3{border-left-color:var(--line)}
.kcard b{display:block;font-weight:500;font-size:13.5px;margin:3px 0 6px}
.kcard .km{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--ink-3);flex-wrap:wrap}

/* floors */
.floors{display:flex;flex-direction:column;gap:3px}
.fl{display:grid;grid-template-columns:40px repeat(var(--n),minmax(0,1fr));gap:3px;align-items:center}
.fl .fn{font-size:11px;color:var(--ink-3);text-align:right;padding-right:6px;font-variant-numeric:tabular-nums}
.cell{height:24px;border-radius:5px;border:0;cursor:pointer;font-size:10.5px;font-weight:600;padding:0;background:var(--line-2);color:var(--ink-3);font-variant-numeric:tabular-nums}
.cell:hover{outline:2px solid var(--gold-500);outline-offset:1px}
.c-own{background:#2F8A5D;color:#fff}.c-rent{background:#D3AE55;color:#3A2A06}.c-empty{background:var(--line);color:var(--ink-3)}.c-fix{background:#5E8FB8;color:#fff}
.c-d0{background:var(--em-100);color:var(--em-700)}.c-d1{background:#F1CF7A;color:#3A2A06}.c-d2{background:#EB8E53;color:#fff}.c-d3{background:#BE3A33;color:#fff}
.c-k0{background:var(--em-100);color:var(--em-700)}.c-k1{background:#EB8E53;color:#fff}.c-k2{background:#BE3A33;color:#fff}
.lobby{grid-column:2/-1;height:24px;border-radius:5px;background:repeating-linear-gradient(135deg,var(--surface-2) 0 6px,var(--line-2) 6px 12px);font-size:11px;color:var(--ink-3);display:flex;align-items:center;padding:0 8px;gap:8px;overflow:hidden;white-space:nowrap}
.lg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink-3);margin:10px 0}
.lg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-2px}

/* facility tiles */
.fac{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.ft{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;position:relative}
.ft:hover{border-color:var(--gold-500)}
.ft .fi{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--em-50);color:var(--em-600);margin-bottom:10px}
.ft b{display:block;font-size:14.5px}
.ft .fz{font-size:12.5px;color:var(--ink-3)}
.ft .fm{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12.5px;color:var(--ink-2);gap:8px;flex-wrap:wrap}
.ft.off{background:repeating-linear-gradient(135deg,var(--surface) 0 10px,var(--surface-2) 10px 20px)}

/* timeline */
.tl{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);overflow-x:auto}
.tl-in{min-width:760px}
.tl-r{display:grid;grid-template-columns:170px 1fr;border-bottom:1px solid var(--line-2);min-height:44px}
.tl-r:last-child{border-bottom:0}
.tl-n{padding:10px 12px;font-size:13px;font-weight:500;border-right:1px solid var(--line-2);display:flex;align-items:center}
.tl-c{position:relative;background-image:linear-gradient(90deg,var(--line-2) 1px,transparent 1px);background-size:calc(100%/17) 100%;cursor:copy}
.tl-h .tl-c{cursor:default;background:none;display:flex}
.tl-h .tl-c span{flex:1;font-size:11px;color:var(--ink-3);padding:6px 0 6px 3px;border-left:1px solid var(--line-2)}
.tl-b{position:absolute;top:6px;bottom:6px;border-radius:7px;background:var(--em-600);color:#fff;font-size:11.5px;padding:3px 7px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer;border:1px solid rgba(0,0,0,.08)}
.tl-b.pend{background:var(--gold-500);color:#33250A}
.tl-b.done{background:var(--ink-3)}
.tl-now{position:absolute;top:0;bottom:0;width:2px;background:#C8453D;pointer-events:none}

/* cal 14 days */
.cal{display:grid;grid-template-columns:repeat(7,minmax(130px,1fr));gap:8px;overflow-x:auto}
.cd{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;min-height:120px}
.cd.today{border-color:var(--gold-500);box-shadow:inset 0 3px 0 var(--gold-500)}
.cd h5{margin:0 0 6px;font-size:12px;color:var(--ink-3);font-weight:600}
.cd h5 b{font-size:16px;color:var(--ink);margin-right:4px}
.cd .ev{display:block;width:100%;text-align:left;border:0;border-radius:6px;padding:4px 7px;margin-top:4px;font-size:11.5px;background:var(--em-50);color:var(--em-700);cursor:pointer;line-height:1.3}
.cd .ev.late{background:var(--bad-bg);color:var(--bad)}
.cd .ev.done{background:var(--surface-2);color:var(--ink-3);text-decoration:line-through}

/* alarms */
.al{display:flex;flex-direction:column;gap:8px}
.ar{display:grid;grid-template-columns:118px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer}
.ar:hover{border-color:var(--gold-500)}
.ar.l3{border-left:4px solid #B8342E}.ar.l2{border-left:4px solid var(--hot)}.ar.l1{border-left:4px solid var(--warn)}.ar.l0{border-left:4px solid var(--info)}
.ar b{font-weight:600;display:block}.ar span{font-size:12.5px;color:var(--ink-3)}
.ar .aw{text-align:right;font-size:12.5px;white-space:nowrap}

/* audit */
.au{display:flex;flex-direction:column}
.ae{display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;padding:12px 4px;border-bottom:1px solid var(--line-2)}
.ae .at{font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.ae .at b{display:block;color:var(--ink);font-weight:600}
.ae .ah{font-weight:500}
.ae ul{margin:6px 0 0;padding:0;list-style:none;font-size:12.5px}
.ae li{padding:2px 0;color:var(--ink-2)}
.ae del{color:var(--bad);background:var(--bad-bg);text-decoration:line-through;padding:0 4px;border-radius:4px}
.ae ins{color:var(--ok);background:var(--ok-bg);text-decoration:none;padding:0 4px;border-radius:4px}
.integ{display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
.integ .i{width:28px;height:28px}
.integ.ok .i{color:var(--ok)}.integ.bad{border-color:var(--bad);background:var(--bad-bg)}.integ.bad .i{color:var(--bad)}

/* modal, drawer, toast */
.modal{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:rgba(3,28,19,.55);padding:calc(env(safe-area-inset-top,0px) + 16px) 14px calc(env(safe-area-inset-bottom,0px) + 16px);animation:fade .15s ease}
.mb{width:min(780px,100%);max-height:100%;display:flex;flex-direction:column;background:var(--surface);border-radius:18px;box-shadow:0 30px 70px -20px rgba(0,0,0,.5);overflow:hidden;border-top:4px solid transparent;border-image:var(--gold-grad) 1;border-image-slice:1 0 0 0}
.mb.narrow{width:min(460px,100%)}
.mb.wide{width:min(980px,100%)}
.mh{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:18px 22px 10px}
.mh h2{margin:0;font:600 26px/1.1 var(--f-disp);color:var(--title)}
.mh p{margin:4px 0 0;font-size:13px;color:var(--ink-3)}
.mbd{padding:8px 22px 18px;overflow-y:auto}
.mf{display:flex;justify-content:flex-end;gap:8px;padding:12px 22px;border-top:1px solid var(--line-2);background:var(--surface-2);flex-wrap:wrap}
.mf .sp{flex:1}
.ferr{color:var(--bad);font-size:13px;font-weight:500;margin-top:10px}
.sec-t{font:600 18px/1.2 var(--f-disp);color:var(--title);margin:20px 0 8px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:4px 0 14px}
.facts div{background:var(--surface-2);border:1px solid var(--line-2);border-radius:10px;padding:9px 12px}
.facts span{display:block;font-size:11.5px;color:var(--ink-3)}
.facts b{font-weight:600;font-variant-numeric:tabular-nums}
.drawer{position:fixed;inset:0;z-index:85;display:flex;justify-content:flex-end;background:rgba(3,28,19,.45);animation:fade .15s ease}
.dp{width:min(660px,100%);height:100%;background:var(--bg);overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 18px) 22px calc(env(safe-area-inset-bottom,0px) + 28px);box-shadow:-20px 0 50px -20px rgba(0,0,0,.4);animation:slide .22s ease}
.dh{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.dh .big{font:700 58px/0.9 var(--f-disp);background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:4px}
.dh h2{margin:0;font:600 28px/1.05 var(--f-disp);color:var(--title)}
.dh p{margin:3px 0 0;color:var(--ink-3);font-size:13px}
.dh .x{margin-left:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chipb{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--gold-300);background:var(--gold-100);color:var(--gold-700);border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:500;cursor:pointer}
.chipb .i{width:14px;height:14px}
#toast-root{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:calc(100% - 28px)}
.toast{background:#0A3F2A;color:#F4EFD9;border:1px solid rgba(233,211,143,.45);padding:10px 16px;border-radius:12px;box-shadow:0 12px 30px -10px rgba(0,0,0,.45);font-size:13.5px;font-weight:500;animation:up .2s ease;transition:opacity .3s}
.toast.t-bad{background:#7D2420;border-color:#E8A39D;color:#fff}
.toast.out{opacity:0}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slide{from{transform:translateX(40px);opacity:.3}to{transform:none;opacity:1}}
@keyframes up{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.note{background:var(--gold-100);border:1px solid var(--gold-300);color:var(--ink-2);border-radius:12px;padding:12px 14px;font-size:13px}
.set-sec{margin-bottom:22px}
.data-tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.dtool{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--surface);display:flex;flex-direction:column;gap:8px}
.dtool b{font-size:14px}.dtool p{margin:0;font-size:12.5px;color:var(--ink-3);flex:1}
.stars{color:var(--gold-500);letter-spacing:1px}

@media (max-width:1180px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.g-hero{grid-template-columns:1fr}}
@media (max-width:960px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;height:100%;width:284px;transform:translateX(-104%);transition:transform .22s ease;z-index:95;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  .side.open{transform:none;box-shadow:20px 0 50px rgba(0,0,0,.35)}
  .scrim.on{display:block;position:fixed;inset:0;background:rgba(3,28,19,.45);z-index:94}
  .iconbtn.menu-btn{display:inline-grid}
  .top{padding:9px 14px;gap:8px}
  .rolepill span{display:none}
  #view{padding:18px 14px 70px}
  .ph h1{font-size:32px}
  .g2,.g3,.g-21{grid-template-columns:1fr}
  .fg{grid-template-columns:1fr}
  .ar{grid-template-columns:1fr;gap:6px}
  .ar .aw{text-align:left}
  .ae{grid-template-columns:1fr;gap:4px}
  .strip{grid-template-columns:repeat(2,minmax(0,1fr))}
  .strip .sv{font-size:21px}
}
@media (max-width:640px){
  .ribbon .rb-items button:nth-child(n+3){display:none}
  .seg{max-width:100%;overflow-x:auto}
  .map .sm-hide{display:none}
  .map-wrap{padding:14px 10px 10px}
  .fl{grid-template-columns:30px repeat(var(--n),minmax(0,1fr));gap:2px}
  .cell{height:22px;font-size:9.5px}
  .mh h2{font-size:23px}
  .mbd{padding:6px 16px 16px}.mh{padding:16px 16px 8px}.mf{padding:10px 16px}
  .gs input{font-size:16px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media print{.side,.top,.acts,.fbar,.pager{display:none!important}.app{display:block}#view{padding:0}}
.gs-res button>span:first-child{font-size:11.5px;color:var(--ink-3);width:86px;flex:none;padding-top:2px}
.gs-res .empty-s{padding:14px}
/* v2 */
.ntc{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.nt{border:1px solid var(--gold-300);background:linear-gradient(180deg,var(--gold-100),transparent 70%);border-radius:12px;padding:12px 14px;cursor:pointer}
.nt:hover{border-color:var(--gold-500)}
.nt .km{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.nt b{display:block;margin:8px 0 4px;font-weight:600}
.nt p{margin:0;font-size:13px;color:var(--ink-2);white-space:pre-line}
.rep-wrap{background:#EEF1EE;border:1px solid var(--line);border-radius:var(--r-lg);overflow:auto;padding:14px 0}
.rep-wrap .rep{box-shadow:0 8px 30px -12px rgba(0,0,0,.25)}
.shw td{min-width:128px;vertical-align:top}.shw td:first-child{min-width:130px}
.shw th.tdy,.shw td.tdy{background:var(--gold-100)}
.sh-l{display:flex;flex-wrap:wrap;gap:3px;align-items:center;margin-bottom:5px}
.sh-t{font-size:11px;color:var(--ink-3);width:34px;flex:none}
.sh-p{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:1px 6px;font-size:11.5px;cursor:pointer;color:var(--ink)}
.sh-p:hover{border-color:var(--em-500)}
.sh-p.abs{background:var(--bad-bg);color:var(--bad);border-color:transparent;text-decoration:line-through}
.sh-p.chg{background:var(--warn-bg);border-color:transparent}
.sh-gap{font-size:11px;font-weight:600;color:var(--bad);background:var(--bad-bg);border-radius:6px;padding:1px 6px}
.sh-add{border:1px dashed var(--line);background:none;border-radius:6px;width:22px;height:20px;line-height:1;cursor:pointer;color:var(--ink-3)}
.msgc{background:var(--surface-2);border:1px solid var(--line-2);border-radius:12px;padding:12px 14px;white-space:normal;line-height:1.6}

function taskDone(r) {
  if (!requireAdmin()) return;
  const m = modal({ title: 'Xác nhận hoàn thành', sub: `${r.code}, ${esc(r.title)}`, size: 'narrow', body: `<form class="fg" style="grid-template-columns:1fr">${fieldHTML(F('doneAt', 'Thời điểm hoàn thành', 'dt', { req: 1 }), nowDT())}${fieldHTML(F('actualHours', 'Thời gian thực tế (giờ)', 'num', { req: 1 }), r.estHours)}${fieldHTML(F('cost', 'Chi phí (đ)', 'money'), r.cost || '')}${fieldHTML(F('note', 'Ghi chú nghiệm thu', 'textarea'), r.note || '')}</form>${FREQD[r.frequency] ? `<p class="muted small">Việc ${r.frequency.toLowerCase()}: kỳ tiếp theo sẽ tự lên lịch.</p>` : ''}`, foot: `<span class="sp"></span><button class="btn" data-x="c">Hủy</button><button class="btn pri" data-x="s">${ic('check')}Hoàn thành</button>` });

  m.querySelector('[data-x=s]').onclick = () => { const f = m.querySelector('form'); const d = { status: 'Hoàn thành', doneAt: f.elements.doneAt.value || nowDT(), actualHours: f.elements.actualHours.value === '' ? '' : +f.elements.actualHours.value, cost: f.elements.cost.value === '' ? '' : +f.elements.cost.value, note: f.elements.note.value.trim() }; m.remove(); saveRec('tasks', d, r); render(); toast(`Đã hoàn thành ${r.code}`); };
}
function openCollect(u) {
  if (!requireAdmin()) return;
  const m = modal({ title: 'Ghi nhận thu phí', sub: `Căn ${u.code}, ${esc(u.ownerName)}`, size: 'narrow', body: `<div class="facts"><div><span>Công nợ hiện tại</span><b class="neg">${money(u.debt)}</b></div><div><span>Số tháng nợ</span><b>${u.debtMonths}</b></div></div><form class="fg" style="grid-template-columns:1fr">${fieldHTML(F('amount', 'Số tiền thu (đ)', 'money', { req: 1 }), u.debt)}${fieldHTML(F('date', 'Ngày thu', 'date', { req: 1 }), today())}${fieldHTML(F('ref', 'Số phiếu thu', 'text'), '')}</form><div class="ferr" hidden></div>`, foot: `<span class="sp"></span><button class="btn" data-x="c">Hủy</button><button class="btn pri" data-x="s">${ic('check')}Ghi nhận</button>` });
  m.querySelector('[data-x=c]').onclick = () => m.remove();
  m.querySelector('[data-x=s]').onclick = () => { const f = m.querySelector('form'), amt = +f.elements.amount.value, err = m.querySelector('.ferr');
    if (!(amt > 0) || amt > u.debt) { err.textContent = 'Số tiền phải lớn hơn 0 và không vượt công nợ.'; err.hidden = false; return; }
    const left = u.debt - amt, fee = unitFee(u); m.remove();
    saveRec('units', { debt: left, debtMonths: left > 0 ? Math.max(1, Math.ceil(left / fee - 0.01)) : 0 }, u);
    saveRec('tx', { date: f.elements.date.value || today(), kind: 'Thu', fund: 'Quỹ vận hành', category: 'Phí quản lý', amount: amt, ref: f.elements.ref.value.trim(), desc: `Thu nợ phí quản lý căn ${u.code}`, party: u.ownerName, unit: u.code, status: 'Đã hạch toán', approvedBy: actor, note: '' }, null);
    render(); toast(`Đã ghi nhận thu ${money(amt)} của căn ${u.code}`); };
}
